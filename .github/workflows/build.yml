name: Build and deploy site

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - index.htm
      - css/**
      - js/**
      - docs/**
      - package.json
      - package-lock.json
      - scripts/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - index.html
      - index.htm
      - css/**
      - js/**
      - docs/**
      - package.json
      - package-lock.json
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint HTML (non-blocking)
        run: npm run lint:html
        continue-on-error: true

      - name: Lint CSS (non-blocking)
        run: npm run lint:css
        continue-on-error: true

      - name: Lint JavaScript (non-blocking)
        run: npm run lint:js
        continue-on-error: true

      - name: Bundle and minify site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
